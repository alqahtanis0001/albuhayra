services:
  - type: web
    name: ledger
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev: NODE_ENV=production below is visible at build time too, and
    # `npm ci` would then skip devDependencies — prisma, typescript and tailwind
    # among them — so the build would fail or `npx prisma` would fetch an
    # unpinned version. `npm run build` already runs `prisma generate`.
    # The seed is deliberately NOT here: the ADMIN account already exists in Neon.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Same major as local development.
      - key: NODE_VERSION
        value: "24"
      # The database is Neon (external), not a Render Postgres, so these are
      # plain secrets pasted into the Render dashboard — there is no `fromDatabase`.
      # DATABASE_URL is Neon's POOLED string (host contains "-pooler"): the app
      # uses it at runtime. DIRECT_URL is the direct string (no "-pooler"): only
      # `prisma migrate deploy` uses it, because migrate takes a session-level
      # advisory lock that the pooler's transaction mode cannot hold.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
