<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!--
    زخم — auth background v2 (login / signup / verify / forgot / reset / pending).
    A deep green band with a gently angled lower edge (momentum), a large ghost star on the band,
    the girih lattice beneath, gold rules from the reading side, gold hairline at the top, paper grain.
    Usage: background: #f5f6f4 url(/brand/auth-bg.svg) center / cover no-repeat fixed;
  -->
  <defs>
    <linearGradient id="band" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#00552A"/>
      <stop offset="0.6" stop-color="#006C35"/>
      <stop offset="1"   stop-color="#0B7A41"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.6" r="0.8">
      <stop offset="0.25" stop-color="#f5f6f4" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#f5f6f4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="girih" width="240" height="240" patternUnits="userSpaceOnUse">
      <g fill="none" stroke-linejoin="round">
        <g stroke="#006C35" stroke-width="1.2" stroke-opacity="0.08">
          <rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/>
          <g transform="translate(-120 -120)"><rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/></g>
          <g transform="translate(120 -120)"><rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/></g>
          <g transform="translate(-120 120)"><rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/></g>
          <g transform="translate(120 120)"><rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/></g>
        </g>
        <g stroke="#C9A227" stroke-width="0.8" stroke-opacity="0.09">
          <rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/>
          <g transform="translate(-120 -120)"><rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/></g>
          <g transform="translate(120 -120)"><rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/></g>
          <g transform="translate(-120 120)"><rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/></g>
          <g transform="translate(120 120)"><rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/></g>
        </g>
        <g stroke="#006C35" stroke-width="1" stroke-opacity="0.06">
          <line x1="160" y1="114" x2="200" y2="114"/><line x1="160" y1="126" x2="200" y2="126"/>
          <line x1="40" y1="114" x2="80" y2="114"/><line x1="40" y1="126" x2="80" y2="126"/>
          <line x1="114" y1="160" x2="114" y2="200"/><line x1="126" y1="160" x2="126" y2="200"/>
          <line x1="114" y1="40" x2="114" y2="80"/><line x1="126" y1="40" x2="126" y2="80"/>
        </g>
      </g>
      <g fill="#C9A227" fill-opacity="0.14">
        <circle cx="120" cy="120" r="2.2"/><circle cx="0" cy="0" r="2.2"/><circle cx="240" cy="0" r="2.2"/><circle cx="0" cy="240" r="2.2"/><circle cx="240" cy="240" r="2.2"/>
      </g>
    </pattern>
    <pattern id="girihLight" width="240" height="240" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-linejoin="round">
        <g stroke-width="1.2" stroke-opacity="0.10">
          <rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/>
          <g transform="translate(-120 -120)"><rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/></g>
          <g transform="translate(120 -120)"><rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/></g>
          <g transform="translate(-120 120)"><rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/></g>
          <g transform="translate(120 120)"><rect x="80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80" transform="rotate(45 120 120)"/></g>
        </g>
        <g stroke-width="0.8" stroke-opacity="0.07">
          <rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/>
          <g transform="translate(-120 -120)"><rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/></g>
          <g transform="translate(120 -120)"><rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/></g>
          <g transform="translate(-120 120)"><rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/></g>
          <g transform="translate(120 120)"><rect x="92" y="92" width="56" height="56"/><rect x="92" y="92" width="56" height="56" transform="rotate(45 120 120)"/></g>
        </g>
      </g>
    </pattern>

    <clipPath id="bandClip">
      <!-- angled lower edge: higher on the left, lower on the reading (right) side -->
      <polygon points="0,0 1920,0 1920,430 0,350"/>
    </clipPath>
    <g id="bigstar">
      <rect x="-300" y="-300" width="600" height="600"/>
      <rect x="-300" y="-300" width="600" height="600" transform="rotate(45)"/>
      <rect x="-200" y="-200" width="400" height="400"/>
      <rect x="-200" y="-200" width="400" height="400" transform="rotate(45)"/>
    </g>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="120%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f5f6f4"/>
  <rect width="1920" height="1080" fill="url(#girih)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- soft shadow under the band's angled edge -->
  <polygon points="0,362 1920,442 1920,470 0,390" fill="#006C35" fill-opacity="0.12" filter="url(#soft)"/>

  <!-- the band -->
  <g clip-path="url(#bandClip)">
    <rect width="1920" height="440" fill="url(#band)"/>
    <rect width="1920" height="440" fill="url(#girihLight)"/>
    <rect width="1920" height="440" fill="url(#sheen)"/>
    <g transform="translate(1720 60)" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.09" stroke-linejoin="round">
      <use href="#bigstar"/>
    </g>
  </g>

  <rect width="1920" height="1080" fill="none" filter="url(#grain)"/>

  <!-- gold momentum rules on the band, from the reading side -->
  <g fill="#C9A227">
    <rect x="1240" y="300" width="680" height="8" rx="4" fill-opacity="0.9"/>
    <rect x="1420" y="324" width="500" height="8" rx="4" fill-opacity="0.6"/>
    <rect x="1600" y="348" width="320" height="8" rx="4" fill-opacity="0.32"/>
  </g>
  <rect x="0" y="0" width="1920" height="4" fill="#C9A227"/>
</svg>
